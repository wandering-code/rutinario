services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://rutinario:rutinario@db:5432/rutinario
    depends_on:
      - db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rutinario
      POSTGRES_PASSWORD: rutinario
      POSTGRES_DB: rutinario
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
