# /etc/nginx/sites-enabled/rutinario en el mini PC.
# Cloudflare Tunnel apunta rutinario.wanderingcode.dev → http://localhost:3014
server {
    listen 3014;
    server_name _;

    root /home/wander/apps/rutinario/frontend/dist;
    index index.html;

    # Fotos de ejercicios desde el móvil (el backend limita a 15 MB).
    client_max_body_size 20m;

    # API: se quita el prefijo /api, igual que el proxy de Vite en dev.
    location /api/ {
        proxy_pass http://127.0.0.1:8007/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8007/uploads/;
    }

    # El service worker y el index nunca desde caché: si no, la PWA instalada
    # no se entera de que hay versión nueva.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Los assets llevan hash en el nombre: para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: cualquier otra ruta (/rutina/3, /ejercicios…) sirve el index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
